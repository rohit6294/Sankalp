<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Sankalp Aspirants</title>
  <meta property="og:site_name" content="Sankalp">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 0;">

  <div style="width:100%; max-width:500px; padding:24px;">

    <!-- Logo -->
    <div style="text-align:center; margin-bottom:40px;">
      <a href="index.html" class="brand" style="display:inline-flex; gap:12px; justify-content:center;">
        <span class="brand-mark" style="width:52px; height:52px; font-size:24px;">S</span>
        <span style="text-align:left;">
          <div class="brand-name" style="font-size:18px;">SANKALP ASPIRANTS</div>
          <div class="brand-sub">JEE/WBJEE PREPARATION</div>
        </span>
      </a>
    </div>

    <!-- Card -->
    <div style="border:1px solid var(--ink); background:var(--paper-soft); padding:40px 36px;">
      <h2 class="display-md" style="text-align:center; margin-bottom:6px;">Create your account.</h2>
      <p class="lede" style="text-align:center; margin-bottom:32px; max-width:none;">Start your WBJEE journey today — it's free.</p>

      <!-- Google -->
      <button onclick="registerWithGoogle()" style="width:100%; display:flex; align-items:center; justify-content:center; gap:12px; padding:14px; border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:var(--font-sans); font-size:14px; font-weight:600; cursor:pointer; transition:all 0.15s; margin-bottom:24px;" onmouseover="this.style.background='var(--ink)';this.style.color='var(--paper)'" onmouseout="this.style.background='var(--paper)';this.style.color='var(--ink)'">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px" alt="Google">
        Continue with Google
      </button>

      <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
        <div style="flex:1; height:1px; background:var(--rule);"></div>
        <span class="eyebrow">or register with email</span>
        <div style="flex:1; height:1px; background:var(--rule);"></div>
      </div>

      <form onsubmit="registerWithEmail(event)">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;">
          <div>
            <label class="input-label">First Name</label>
            <input type="text" id="firstName" class="input-field" placeholder="Arjun" required>
          </div>
          <div>
            <label class="input-label">Last Name</label>
            <input type="text" id="lastName" class="input-field" placeholder="Das" required>
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label class="input-label">Email Address</label>
          <div style="position:relative;">
            <i class="fas fa-envelope" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-mute); font-size:14px;"></i>
            <input type="email" id="email" class="input-field" placeholder="you@example.com" required style="padding-left:40px;">
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label class="input-label">Phone Number</label>
          <div style="position:relative;">
            <i class="fas fa-phone" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-mute); font-size:14px;"></i>
            <input type="tel" id="phone" class="input-field" placeholder="+91 98765 43210" style="padding-left:40px;">
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label class="input-label">WBJEE Year</label>
          <select id="year" class="input-field">
            <option value="" disabled selected>Select your WBJEE year</option>
            <option value="2025">WBJEE 2025</option>
            <option value="2026">WBJEE 2026</option>
            <option value="2027">WBJEE 2027</option>
          </select>
        </div>

        <div style="margin-bottom:18px;">
          <label class="input-label">Password</label>
          <div style="position:relative;">
            <i class="fas fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-mute); font-size:14px;"></i>
            <input type="password" id="password" class="input-field" placeholder="Min 8 characters" required style="padding-left:40px; padding-right:44px;" oninput="checkPassword(this.value)">
            <button type="button" onclick="togglePassword()" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-mute); cursor:pointer;">
              <i class="fas fa-eye" id="eyeIcon" style="font-size:14px;"></i>
            </button>
          </div>
          <!-- Password strength -->
          <div style="margin-top:8px;">
            <div class="progress-bar" style="height:4px;">
              <div id="strengthBar" class="progress-fill" style="width:0%; transition:all 0.3s;"></div>
            </div>
            <div id="strengthText" style="font-size:11px; margin-top:4px; color:var(--ink-mute); font-family:var(--font-sans); font-weight:600; letter-spacing:0.1em; text-transform:uppercase;"></div>
          </div>
        </div>

        <div style="margin-bottom:24px;">
          <label class="input-label">Confirm Password</label>
          <div style="position:relative;">
            <i class="fas fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-mute); font-size:14px;"></i>
            <input type="password" id="confirmPassword" class="input-field" placeholder="Repeat password" required style="padding-left:40px;">
          </div>
        </div>

        <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:24px;">
          <input type="checkbox" id="terms" required style="margin-top:3px; accent-color:var(--rust);">
          <label for="terms" style="font-size:13px; color:var(--ink-mute); line-height:1.5; font-family:var(--font-sans);">
            I agree to the <a href="#" style="color:var(--rust); font-weight:600;">Terms of Service</a> and <a href="#" style="color:var(--rust); font-weight:600;">Privacy Policy</a>
          </label>
        </div>

        <div id="errorMsg" style="display:none; background:var(--paper); border:1px solid var(--rust); padding:14px; margin-bottom:18px; font-size:13px; color:var(--rust); font-family:var(--font-sans);"></div>

        <button type="submit" id="registerBtn" class="btn-rust" style="width:100%; justify-content:center; padding:16px;">
          <i class="fas fa-user-plus"></i> Create Free Account
        </button>
      </form>

      <p style="text-align:center; margin-top:24px; font-size:14px; color:var(--ink-mute);">
        Already have an account? <a href="login.html" style="color:var(--rust); font-weight:700;">Login here</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    function checkPassword(val) {
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      let strength = 0;
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;
      const levels = [
        { w: '25%', c: 'var(--rust)', t: 'Weak' },
        { w: '50%', c: 'var(--rust)', t: 'Fair' },
        { w: '75%', c: 'var(--forest)', t: 'Good' },
        { w: '100%', c: 'var(--forest)', t: 'Strong' },
      ];
      if (val.length === 0) { bar.style.width = '0%'; text.textContent = ''; return; }
      const l = levels[Math.max(0, strength - 1)];
      bar.style.width = l.w; bar.style.background = l.c; text.textContent = l.t; text.style.color = l.c;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function registerWithEmail(e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const year = document.getElementById('year').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('registerBtn');

      if (password !== confirm) { showError('Passwords do not match.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner" style="width:18px;height:18px;border-width:2px"></span> Creating account...';

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: `${firstName} ${lastName}` });
        await db.collection('users').doc(cred.user.uid).set({
          name: `${firstName} ${lastName}`,
          firstName, lastName, email, phone,
          wbjeeYear: year,
          role: 'student',
          xp: 0,
          streak: 0,
          badges: [],
          enrolledCourses: [],
          completedModules: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = 'student/evaluate.html';
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Free Account';
        const msgs = {
          'auth/email-already-in-use': 'An account with this email already exists.',
          'auth/weak-password': 'Password is too weak.',
          'auth/invalid-email': 'Please enter a valid email address.',
        };
        showError(msgs[err.code] || err.message);
      }
    }

    async function registerWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        
        const adminEmails = ['rohitgupta6294@gmail.com', 'rahulgupta6294@gmail.com'];
        const isAdmin = adminEmails.includes(user.email.toLowerCase());
        
        if (isAdmin) {
          // Verify admin and write direct document to avoid collection-wide queries
          const userRef = db.collection('users').doc(user.uid);
          await userRef.set({
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            role: 'admin',
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          window.location.href = 'admin/evaluators.html';
          return;
        }
        
        // Ensure student document exists under UID (without query by email to avoid permission errors)
        const userRef = db.collection('users').doc(user.uid);
        const doc = await userRef.get();
        if (!doc.exists) {
          await userRef.set({
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            role: 'student',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            xp: 0, streak: 0,
            badges: [], enrolledCourses: [], completedModules: [],
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        
        window.location.href = 'student/evaluate.html';
      } catch (err) {
        console.error(err);
        showError('Google signup failed. Please try again.');
      }
    }

    // Auto redirect based on role if already logged in
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const adminEmails = ['rohitgupta6294@gmail.com', 'rahulgupta6294@gmail.com'];
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          const role = doc.exists ? doc.data().role : 'student';
          window.location.href = role === 'admin' ? 'admin/evaluators.html' : 'student/evaluate.html';
        } catch(e) {
          // Robust fallback routing using email checks if Firestore read throws permission error
          if (adminEmails.includes(user.email.toLowerCase())) {
            window.location.href = 'admin/evaluators.html';
          } else {
            window.location.href = 'student/evaluate.html';
          }
        }
      }
    });
  </script>
</body>
</html>
