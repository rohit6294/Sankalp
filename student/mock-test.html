<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WBJEE Mock Tests — Sankalp Aspirant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/profile-check.js"></script>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <a href="../index.html" class="brand">
      <span class="brand-mark">S</span>
      <span>
        <div class="brand-name">SANKALP WBJEE</div>
        <div class="brand-sub">WBJEE Prep · Est. 2026</div>
      </span>
    </a>
  </div>
  <nav style="padding:8px 0;">
    <div class="eyebrow" style="padding:14px 22px 8px;">Main</div>
    <a href="evaluate.html" class="sidebar-link"><i class="fas fa-clipboard-check" style="width:18px"></i> Evaluate Sheet</a>
    <a href="notes.html" class="sidebar-link"><i class="fas fa-sticky-note" style="width:18px"></i> Notes</a>
    <a href="mock-test.html" class="sidebar-link active"><i class="fas fa-file-alt" style="width:18px"></i> Mock Tests</a>
    <a href="predictor.html" class="sidebar-link"><i class="fas fa-graduation-cap" style="width:18px"></i> College Predictor</a>
    <div class="eyebrow" style="padding:14px 22px 8px;">Account</div>
    <a href="profile.html" class="sidebar-link"><i class="fas fa-user" style="width:18px"></i> Profile</a>
    <a href="#" class="sidebar-link" onclick="logout()"><i class="fas fa-sign-out-alt" style="width:18px"></i> Logout</a>
  </nav>
  <div style="position:absolute; bottom:0; left:0; right:0; padding:16px 22px; border-top:1px solid var(--ink);">
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="avatarSidebar" class="brand-mark" style="width:34px; height:34px; font-size:14px;">?</div>
      <div style="overflow:hidden;">
        <div id="sidebarName" style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Loading...</div>
        <div id="sidebarEmail" style="font-size:11px; color:var(--ink-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
      </div>
    </div>
  </div>
</aside>

<main class="main-content" style="padding:28px 32px">
  <div id="listView">
    <div style="margin-bottom:28px">
      <h1 class="display-lg">WBJEE Mock Tests 🚀</h1>
      <p style="color:var(--ink-mute);font-size:13px;margin-top:4px">Strict WBJEE pattern: +1/-0.25 (Cat 1), +2/-0.5 (Cat 2), +2/0 partial (Cat 3)</p>
    </div>

    <!-- Removed hardcoded subscription banner -->

    <!-- Test Series Section -->
    <div id="seriesSection" style="display:none;margin-bottom:40px">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--ink)"><i class="fas fa-layer-group" style="color:#8B5CF6;margin-right:8px"></i> Test Series Packages</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px" id="seriesGrid"></div>
    </div>

    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--ink)"><i class="fas fa-file-alt" style="color:var(--ink-mute);margin-right:8px"></i> Individual Tests</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px" id="testGrid">
      <div style="color:var(--ink-mute);font-size:14px;grid-column:1/-1;text-align:center;padding:40px"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </div>
  </div>
</main>

<script>
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
  function logout() { auth.signOut().then(() => window.location.href = '../login.html'); }

  async function apiJson(path, options = {}) {
    const API = window.EVALUATOR_API || 'http://127.0.0.1:3000';
    const token = await auth.currentUser.getIdToken();
    const headers = { Authorization: `Bearer ${token}`, ...(options.headers || {}) };
    if (options.body !== undefined && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    let response = await fetch(`${API}${path}`, { ...options, headers });
    if (response.status === 401) {
      const freshToken = await auth.currentUser.getIdToken(true);
      response = await fetch(`${API}${path}`, { ...options, headers: { ...headers, Authorization: `Bearer ${freshToken}` } });
    }
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
    return payload;
  }

  function toast(msg, type='info') {
    const el = document.createElement('div');
    el.className = `notification ${type}`;
    el.innerHTML = `<i class="fas fa-${type==='error'?'exclamation-circle':'check-circle'}"></i> ${msg}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }

  let tests = [];
  let series = [];

  async function loadTests() {
    try {
      const data = await apiJson('/api/tests/available');
      tests = data.tests || [];
      series = data.series || [];
      renderSeries();
      renderTests();
    } catch(e) {
      toast(e.message, 'error');
    }
  }

  function renderSeries() {
    const sSection = document.getElementById('seriesSection');
    const grid = document.getElementById('seriesGrid');
    if(!series.length) { sSection.style.display = 'none'; return; }
    
    sSection.style.display = 'block';
    grid.innerHTML = series.map(s => {
      let actionBtn = s.allowed 
        ? `<button disabled class="btn-ghost" style="width:100%;justify-content:center;color:var(--forest)"><i class="fas fa-check" style="margin-right:6px"></i> Purchased</button>`
        : `<button onclick="buySeries('${s.id}', ${s.price})" class="btn-rust" style="width:100%;justify-content:center"><i class="fas fa-unlock" style="margin-right:6px"></i> Unlock Series (₹${s.price})</button>`;
        
      return `
      <div class="q-card" style="padding:24px;border:1px solid var(--rule-strong);box-shadow:0 4px 6px -1px rgba(0,0,0,0.02)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div>
            <div style="font-weight:700;font-size:16px;color:var(--ink)">${s.title}</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">${s.description || 'Bundle of mock tests'}</div>
          </div>
          <span class="badge" style="background:rgba(139,92,246,0.1);color:#8B5CF6;">SERIES</span>
        </div>
        ${actionBtn}
      </div>`;
    }).join('');
  }

  function renderTests() {
    const grid = document.getElementById('testGrid');
    if(!tests.length) { grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748B">No tests found.</div>`; return; }
    
    grid.innerHTML = tests.map(t => {
      let icon = t.subject === 'Physics' ? '⚡' : t.subject === 'Chemistry' ? '🧪' : t.subject === 'Mathematics' ? '📐' : '📝';
      let accent = t.subject === 'Physics' ? '#818CF8' : t.subject === 'Chemistry' ? '#34D399' : t.subject === 'Mathematics' ? '#FCD34D' : '#F87171';
      let color = t.subject === 'Physics' ? 'rgba(79,70,229,0.08)' : t.subject === 'Chemistry' ? 'rgba(16,185,129,0.08)' : t.subject === 'Mathematics' ? 'rgba(245,158,11,0.08)' : 'rgba(239,68,68,0.08)';
      
      let seriesBadge = t.seriesId ? `<span style="background:rgba(139,92,246,0.15);color:#A78BFA;font-size:9px;font-weight:700;padding:2px 6px;border-radius:100px;margin-left:8px"><i class="fas fa-layer-group"></i> IN SERIES</span>` : '';

      let actionBtn = '';
      if(t.allowed) {
        actionBtn = `<button onclick="window.location.href='exam-viewer.html?id=${t.id}'" class="btn-rust" style="width:100%;justify-content:center"><i class="fas fa-play" style="margin-right:6px"></i> Start Test</button>`;
      } else if (t.seriesId) {
        const pSeries = series.find(x => x.id === t.seriesId);
        if (pSeries && !pSeries.allowed) {
          actionBtn = `<button onclick="buySeries('${t.seriesId}', ${pSeries.price})" class="btn-ghost" style="width:100%;justify-content:center;color:var(--rust);border-color:rgba(217,119,6,0.2)"><i class="fas fa-lock" style="margin-right:6px"></i> Buy Series to Unlock</button>`;
        } else if (!pSeries) {
          actionBtn = `<button disabled class="btn-ghost" style="width:100%;justify-content:center;color:#EF4444;cursor:not-allowed"><i class="fas fa-lock" style="margin-right:6px"></i> Series Unavailable</button>`;
        }
      } else if (t.accessType === 'paid') {
        actionBtn = `<button onclick="buyTest('${t.id}', ${t.price})" class="btn-rust" style="width:100%;justify-content:center"><i class="fas fa-lock" style="margin-right:6px"></i> Buy Test (₹${t.price})</button>`;
      } else if (t.accessType === 'subscription') {
        actionBtn = `<button disabled class="btn-ghost" style="width:100%;justify-content:center"><i class="fas fa-lock" style="margin-right:6px"></i> Requires Pass</button>`;
      }

      let badge = '';
      if(t.accessType==='free') badge='<span style="background:rgba(16,185,129,0.15);color:#34D399;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px">FREE</span>';
      else if(t.accessType==='subscription') badge='<span style="background:rgba(139,92,246,0.15);color:#A78BFA;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px">WBJEE PASS</span>';
      return `
      <div class="q-card" style="padding:24px;border:1px solid var(--rule-strong);box-shadow:0 4px 6px -1px rgba(0,0,0,0.02)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div>
            <div style="font-weight:700;font-size:15px;color:var(--ink)">${t.title}</div>
            <div style="font-size:11px;color:var(--ink-mute);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em">${t.type || 'Test'} · ${t.subject}</div>
          </div>
          ${badge}
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;background:var(--paper-deep);padding:12px;border-radius:8px">
          <div style="font-size:12px;color:var(--ink-soft);font-weight:600"><i class="fas fa-clock" style="color:var(--ink-mute);margin-right:4px"></i> ${t.durationMin || t.duration}m</div>
          <div style="font-size:12px;color:var(--ink-soft);font-weight:600"><i class="fas fa-list-ol" style="color:var(--ink-mute);margin-right:4px"></i> ${t.totalQuestions} Qs</div>
          <div style="font-size:12px;color:var(--ink-soft);font-weight:600;grid-column:1/-1"><i class="fas fa-layer-group" style="color:var(--ink-mute);margin-right:4px"></i> Series: <span style="color:var(--rust)">${t.seriesTitle||'None'}</span></div>
        </div>

        ${actionBtn}
      </div>`;
    }).join('');
  }

  // --- Payment Integration ---
  async function handlePayment(product, productId = null) {
    try {
      const orderData = await apiJson('/api/payment/create-order', {
        method: 'POST',
        body: JSON.stringify({ product, productId })
      });

      const options = {
        key: orderData.key_id,
        amount: orderData.amount,
        currency: orderData.currency,
        name: "Sankalp Learning",
        description: product === 'mock_test_subscription' ? "WBJEE Mock Test Pass" : "Mock Test Unlock",
        order_id: orderData.order_id,
        handler: async function (response) {
          toast('Verifying payment...', 'info');
          try {
            await apiJson('/api/payment/verify', {
              method: 'POST',
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature
              })
            });
            toast('Payment successful! Reloading...', 'success');
            setTimeout(() => location.reload(), 1500);
          } catch(err) {
            toast('Payment verification failed.', 'error');
          }
        },
        prefill: { name: auth.currentUser.displayName, email: auth.currentUser.email },
        theme: { color: "#D97706" } // Using var(--rust) equivalent color
      };

      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function (response){ toast('Payment failed. Please try again.', 'error'); });
      rzp.open();
    } catch(err) {
      toast(err.message, 'error');
    }
  }

  function buyTest(id, price) {
    handlePayment('mock_test', id);
  }
  function buySubscription() {
    handlePayment('mock_test_subscription');
  }
  function buySeries(id, price) {
    handlePayment('mock_test_series', id);
  }

  auth.onAuthStateChanged(user => {
    if (!user) { window.location.href = '../login.html'; return; }
    const firstName = (user.displayName || 'Student').split(' ')[0];
    document.getElementById('avatarSidebar').textContent = firstName[0].toUpperCase();
    document.getElementById('sidebarName').textContent = user.displayName || 'Student';
    document.getElementById('sidebarEmail').textContent = user.email || '';
    loadTests();
  });
</script>
</body>
</html>
